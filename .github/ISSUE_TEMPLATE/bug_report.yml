---
name: Bug Report
description: Report a bug or issue with pypaperless
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Note on Response Times

        pypaperless is a private side project. I'm a family father with a full-time job, so replies can sometimes take a while - but I will always reply. Thanks for your patience! 🙏

        If you're able to investigate and submit a pull request with a fix, that would be greatly appreciated and will significantly speed up the resolution.

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: pypaperless-version
    attributes:
      label: pypaperless Version
      placeholder: e.g., 1.2.3
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: e.g., 3.11.5
    validations:
      required: true

  - type: input
    id: paperless-version
    attributes:
      label: Paperless-ngx Version
      placeholder: e.g., 2.4.0
    validations:
      required: true
